<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vincent (WebGL/PixiJS)</title>

    <style>
        :root {
            --w: 1200;
            --h: 900;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: #111;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .stage-wrap {
            width: min(100%, calc((100vh - 32px) * (var(--w) / var(--h))));
            max-width: calc(var(--w) * 1px);
            min-width: 200px;
            margin: 0 auto;
        }

        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: var(--w) / var(--h);
            overflow: hidden;
            border-radius: 14px;
            background: #1c1c1c;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
            touch-action: none;
            user-select: none;
        }

        .stage canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #fpsCounter {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 20;
            font-family: monospace;
            font-size: 12px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="stage-wrap">
        <div class="stage" id="stage">
            <div id="fpsCounter">FPS: --</div>
        </div>
    </div>

    <!-- PixiJS v7 (WebGL renderer). Neu can dung offline, tai file nay ve va tro toi local path. -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
    <script src="imagesData.js"></script>
    <script>
        (function () {
            const stageEl = document.getElementById('stage');
            const fpsEl = document.getElementById('fpsCounter');

            const STAGE_W = 1200, STAGE_H = 900;

            // === CAU HINH LOGIC (GIU NGUYEN NHU BAN CANVAS 2D) ===
            const EYE_CONFIG = { centerX: 600, centerY: 355, maxRadius: 10 };
            const MAX_DRAG_DIST = 190;
            const MIN_EXTRA_LENGTH = 2000;
            const THREAD_COUNT = 7;
            const THREAD_MIN_Y = 150;
            const THREAD_MAX_Y = 800;
            const YARN_COLORS = [0x9D1C14, 0xC41B0D, 0xD95505];
            const EXTRA_EYES_COUNT = 11;

            const extraEyesConfig = [
                { id: '01', radiusX: 12, radiusY: 8, rotation: -30 * Math.PI / 180 },
                { id: '02', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '03', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '04', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '05', radiusX: 12, radiusY: 8, rotation: -35 * Math.PI / 180 },
                { id: '06', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '07', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '08', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '09', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '10', radiusX: 12, radiusY: 8, rotation: -40 * Math.PI / 180 },
                { id: '11', radiusX: 12, radiusY: 8, rotation: -20 * Math.PI / 180 },
            ].map(cfg => ({ ...cfg, currX: 0, currY: 0, targetX: 0, targetY: 0, nextChangeTime: 0 }));

            let isDragging = false;
            let dragSource = null;
            let startStageX = 0;
            let currentOffset = 0;
            let dragStartOffset = 0;

            let targetEye = { x: 0, y: 0 };
            let currentEye = { x: 0, y: 0 };

            // ==========================================
            // 1) KHOI TAO PIXI APPLICATION (WEBGL)
            // ==========================================
            const app = new PIXI.Application({
                width: STAGE_W,
                height: STAGE_H,
                // QUAN TRONG: dung nen DAC (khong trong suot) trung mau voi .stage (#1c1c1c) thay vi
                // backgroundAlpha:0. Canvas WebGL trong suot bi Safari/iOS composite sai (premultiplied
                // alpha) o cac vung co alpha ban trong suot, gay hien tuong mau bi nhat/bac di - day
                // chinh la nguyen nhan cac mat phu bi nhat mau. Vi lop "bg" da phu kin toan bo khung
                // hinh nen doi sang nen dac khong lam thay doi hinh anh, chi loai bo duong compositing loi.
                backgroundColor: 0x1c1c1c,
                backgroundAlpha: 1,
                antialias: true,
                resolution: 1,          // giu 1:1, khong nhan them theo devicePixelRatio de tiet kiem fill-rate tren may yeu
                autoDensity: false,
                powerPreference: 'high-performance',
            });
            stageEl.appendChild(app.view);
            app.view.style.position = 'absolute';
            app.view.style.top = '0';
            app.view.style.left = '0';

            if (!app.renderer || app.renderer.type !== PIXI.RENDERER_TYPE.WEBGL) {
                console.warn('PixiJS dang fallback ve Canvas renderer thay vi WebGL. Hieu nang se khong duoc cai thien nhu mong doi.');
            }

            // ==========================================
            // 2) LOAD ANH (GIU CACH LOAD GIONG BAN CU DE TUONG THICH imagesData.js)
            // ==========================================
            const rawImages = {}; // HTMLImageElement, dung tam de build texture + hit-test alpha
            const textures = {};  // PIXI.Texture

            const imageSources = {
                bg: IMAGE_DATA.Background,
                shade: IMAGE_DATA.Shade,
                inside: IMAGE_DATA.Inside,
                eyeBound: IMAGE_DATA.Eye_Cursor_Bound,
                eye: IMAGE_DATA.Eye_Cursor,
                leftShadow: IMAGE_DATA.Left_Shadow,
                rightShadow: IMAGE_DATA.Right_Shadow,
                left: IMAGE_DATA.Left,
                right: IMAGE_DATA.Right,
                leftMask: IMAGE_DATA.Left_Mask,
                rightMask: IMAGE_DATA.Right_Mask,
            };
            for (let i = 1; i <= EXTRA_EYES_COUNT; i++) {
                const numStr = String(i).padStart(2, '0');
                imageSources[`eye_${numStr}`] = IMAGE_DATA[`Eye_${numStr}`];
                imageSources[`eye_${numStr}_bound`] = IMAGE_DATA[`Eye_${numStr}_Bound`];
            }

            let loadedCount = 0;
            const totalImages = Object.keys(imageSources).length;

            for (let key in imageSources) {
                const img = new Image();
                rawImages[key] = img;
                img.src = imageSources[key];
                img.onload = () => {
                    textures[key] = PIXI.Texture.from(img);
                    loadedCount++;
                    if (loadedCount === totalImages) onAllLoaded();
                };
            }

            // ==========================================
            // 3) HIT-TEST: MANG ALPHA TIEN TINH (khong dinh gi den WebGL, chi doc pixel 1 lan luc load)
            // ==========================================
            const hitCanvas = document.createElement('canvas');
            hitCanvas.width = STAGE_W; hitCanvas.height = STAGE_H;
            const hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });
            let leftAlpha = null, rightAlpha = null;

            function buildAlphaMap(img) {
                hitCtx.clearRect(0, 0, STAGE_W, STAGE_H);
                hitCtx.drawImage(img, 0, 0, STAGE_W, STAGE_H);
                const data = hitCtx.getImageData(0, 0, STAGE_W, STAGE_H).data;
                const alpha = new Uint8ClampedArray(STAGE_W * STAGE_H);
                for (let i = 0, j = 3; i < alpha.length; i++, j += 4) alpha[i] = data[j];
                return alpha;
            }

            // ==========================================
            // 4) DUNG RENDER TEXTURE + BLEND MODE ERASE/MULTIPLY (GPU) DE THAY THE
            //    cho "destination-out" / "multiply" cua canvas 2D truoc day.
            //    Cac lop nay chi phu thuoc currentOffset (khong animation) nen chi
            //    render lai vao RenderTexture khi offset thuc su thay doi.
            // ==========================================
            let lastCachedOffset = null;

            const shadeRT = PIXI.RenderTexture.create({ width: STAGE_W, height: STAGE_H });
            const insideRT = PIXI.RenderTexture.create({ width: STAGE_W, height: STAGE_H });
            const shadowRT = PIXI.RenderTexture.create({ width: STAGE_W, height: STAGE_H });
            const leftRightRT = PIXI.RenderTexture.create({ width: STAGE_W, height: STAGE_H });

            let shadeContainer, insideContainer, shadowContainer, leftRightContainer;
            let shadeSprite, shadeMaskSprite;
            let insideSprite, insideLeftMaskSprite, insideRightMaskSprite;
            let leftShadowSprite, rightShadowSprite;
            let leftPieceSprite, rightPieceSprite;

            function buildCompositors() {
                // --- Shade bi cat bang Right_Mask (destination-out -> ERASE) ---
                shadeSprite = new PIXI.Sprite(textures.shade);
                shadeMaskSprite = new PIXI.Sprite(textures.rightMask);
                shadeMaskSprite.blendMode = PIXI.BLEND_MODES.ERASE;
                shadeContainer = new PIXI.Container();
                shadeContainer.addChild(shadeSprite, shadeMaskSprite);

                // --- Inside bi cat boi ca Left_Mask va Right_Mask ---
                insideSprite = new PIXI.Sprite(textures.inside);
                insideLeftMaskSprite = new PIXI.Sprite(textures.leftMask);
                insideLeftMaskSprite.blendMode = PIXI.BLEND_MODES.ERASE;
                insideRightMaskSprite = new PIXI.Sprite(textures.rightMask);
                insideRightMaskSprite.blendMode = PIXI.BLEND_MODES.ERASE;
                insideContainer = new PIXI.Container();
                insideContainer.addChild(insideSprite, insideLeftMaskSprite, insideRightMaskSprite);

                // --- Left_Shadow x Right_Shadow gop lam 1 (multiply giua 2 anh) ---
                leftShadowSprite = new PIXI.Sprite(textures.leftShadow);
                rightShadowSprite = new PIXI.Sprite(textures.rightShadow);
                rightShadowSprite.blendMode = PIXI.BLEND_MODES.MULTIPLY;
                shadowContainer = new PIXI.Container();
                shadowContainer.addChild(leftShadowSprite, rightShadowSprite);

                // --- Left + Right gop lam 1 (khong blend, chi la 2 lop chong) ---
                leftPieceSprite = new PIXI.Sprite(textures.left);
                rightPieceSprite = new PIXI.Sprite(textures.right);
                leftRightContainer = new PIXI.Container();
                leftRightContainer.addChild(leftPieceSprite, rightPieceSprite);
            }

            function rebuildStaticLayersIfNeeded(force) {
                if (!force && currentOffset === lastCachedOffset) return;

                shadeSprite.x = -currentOffset;
                shadeMaskSprite.x = currentOffset;
                app.renderer.render(shadeContainer, { renderTexture: shadeRT, clear: true });

                insideSprite.x = 0;
                insideLeftMaskSprite.x = -currentOffset;
                insideRightMaskSprite.x = currentOffset;
                app.renderer.render(insideContainer, { renderTexture: insideRT, clear: true });

                leftShadowSprite.x = -currentOffset;
                rightShadowSprite.x = currentOffset;
                app.renderer.render(shadowContainer, { renderTexture: shadowRT, clear: true });

                leftPieceSprite.x = -currentOffset;
                rightPieceSprite.x = currentOffset;
                app.renderer.render(leftRightContainer, { renderTexture: leftRightRT, clear: true });

                lastCachedOffset = currentOffset;
            }

            // ==========================================
            // 5) MAT CHINH + 11 MAT PHU: DUNG RENDERTEXTURE + BLEND MODE 'SRC_IN' (giong het canvas
            //    'source-in') THAY VI sprite.mask CUA PIXI. Ly do: co che .mask cua Pixi chay qua mot
            //    filter pass rieng va xu ly alpha khac di, gay nhat mau. Dung RenderTexture + SRC_IN
            //    (cung ho blend-mode family voi ERASE dang dung cho shade/inside, da xac nhan dung mau)
            //    de dam bao ket qua giong het ban Canvas 2D.
            //
            //    TOI UU FPS: moi RenderTexture chi to bang BOUNDING BOX cua anh "bound" tuong ung
            //    (thay vi full 1200x900), giam khoi luong GPU phai xu ly cho ca 12 mat moi frame.
            // ==========================================
            let eyeResultSprite, eyeContentSprite, eyeBBox, eyeCompositeContainer, eyeRT;
            const extraEyeEntries = []; // { compositeContainer, contentSprite, resultSprite, rt, cfg, bbox }

            function computeBBox(img, padding) {
                if (padding === undefined) padding = 6;
                hitCtx.clearRect(0, 0, STAGE_W, STAGE_H);
                hitCtx.drawImage(img, 0, 0, STAGE_W, STAGE_H);
                const data = hitCtx.getImageData(0, 0, STAGE_W, STAGE_H).data;
                let minX = STAGE_W, minY = STAGE_H, maxX = -1, maxY = -1;
                for (let y = 0; y < STAGE_H; y++) {
                    const rowBase = y * STAGE_W * 4;
                    for (let x = 0; x < STAGE_W; x++) {
                        if (data[rowBase + x * 4 + 3] > 10) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }
                if (maxX < 0) return { x: 0, y: 0, w: STAGE_W, h: STAGE_H };
                minX = Math.max(0, minX - padding);
                minY = Math.max(0, minY - padding);
                maxX = Math.min(STAGE_W - 1, maxX + padding);
                maxY = Math.min(STAGE_H - 1, maxY + padding);
                return { x: minX, y: minY, w: (maxX - minX + 1), h: (maxY - minY + 1) };
            }

            function buildEyes() {
                // --- Mat chinh (padding rong hon vi di chuyen +-10px theo cursor) ---
                eyeBBox = computeBBox(rawImages.eyeBound, 16);
                const eyeBoundForComposite = new PIXI.Sprite(textures.eyeBound);
                eyeBoundForComposite.position.set(-eyeBBox.x, -eyeBBox.y);
                eyeContentSprite = new PIXI.Sprite(textures.eye);
                eyeContentSprite.blendMode = PIXI.BLEND_MODES.SRC_IN; // giu lai mau/alpha cua eye, chi trong pham vi bound co alpha
                eyeCompositeContainer = new PIXI.Container();
                eyeCompositeContainer.addChild(eyeBoundForComposite, eyeContentSprite);

                eyeRT = PIXI.RenderTexture.create({ width: eyeBBox.w, height: eyeBBox.h });
                eyeResultSprite = new PIXI.Sprite(eyeRT); // sprite them vao app.stage
                eyeResultSprite.position.set(eyeBBox.x, eyeBBox.y);

                // --- 11 mat phu (padding vua du cho bien do di chuyen +-12px cua radiusX/radiusY) ---
                extraEyesConfig.forEach(cfg => {
                    const boundImg = rawImages[`eye_${cfg.id}_bound`];
                    const bbox = computeBBox(boundImg, 16);

                    const boundForComposite = new PIXI.Sprite(textures[`eye_${cfg.id}_bound`]);
                    boundForComposite.position.set(-bbox.x, -bbox.y);
                    const contentSprite = new PIXI.Sprite(textures[`eye_${cfg.id}`]);
                    contentSprite.blendMode = PIXI.BLEND_MODES.SRC_IN;

                    const compositeContainer = new PIXI.Container();
                    compositeContainer.addChild(boundForComposite, contentSprite);

                    const rt = PIXI.RenderTexture.create({ width: bbox.w, height: bbox.h });
                    const resultSprite = new PIXI.Sprite(rt);
                    resultSprite.position.set(bbox.x, bbox.y);

                    extraEyeEntries.push({ compositeContainer, contentSprite, resultSprite, rt, cfg, bbox });
                });
            }

            function renderEyesThisFrame() {
                // Mat chinh: vi tri thay doi moi frame (lerp theo cursor) nen phai render lai RT moi frame
                // Vi tri content phai tru di bbox.x/y de dung toa do cuc bo cua RT nho
                eyeContentSprite.position.set(currentEye.x - eyeBBox.x, currentEye.y - eyeBBox.y);
                app.renderer.render(eyeCompositeContainer, { renderTexture: eyeRT, clear: true });

                // 11 mat phu: vi tri cung lerp moi frame -> render lai moi frame
                extraEyeEntries.forEach(entry => {
                    entry.contentSprite.position.set(
                        entry.cfg.currX - entry.bbox.x,
                        entry.cfg.currY - entry.bbox.y
                    );
                    app.renderer.render(entry.compositeContainer, { renderTexture: entry.rt, clear: true });
                });
            }

            // ==========================================
            // 6) DAY LEN: VE BANG PIXI.Graphics (GPU tessellation) MOI FRAME,
            //    ROI ERASE BOI Left_Mask VAO MOT RENDER TEXTURE (van animate nen phai lam moi frame,
            //    nhung gio la GPU thay vi CPU fill).
            // ==========================================
            let threads = [];
            let yarnGraphics, threadsLeftMaskSprite, threadsContainer;
            const threadsRT = PIXI.RenderTexture.create({ width: STAGE_W, height: STAGE_H });

            // === HELPER: DIEM TREN DUONG BEZIER TAI THAM SO t (0..1) ===
            function bezierPointAt(t, x0, y0, cp1x, cp1y, cp2x, cp2y, x1, y1) {
                const mt = 1 - t;
                return {
                    x: mt * mt * mt * x0 + 3 * mt * mt * t * cp1x + 3 * mt * t * t * cp2x + t * t * t * x1,
                    y: mt * mt * mt * y0 + 3 * mt * mt * t * cp1y + 3 * mt * t * t * cp2y + t * t * t * y1
                };
            }

            // === HELPER: TINH MOC DASH (theo tham so t, 0..1) MOT LAN DUY NHAT tu mot hinh dang
            //    "dai dien" luc setup. Vi day chi la MOC THAM SO co dinh (khong phai do dai pixel
            //    thuc te moi frame), khi soi day sau nay dong dua (sag/pulse doi theo thoi gian),
            //    hoa van se DI CHUYEN CUNG VOI VAT LIEU (giong nhu son ve len soi day that) thay vi
            //    "chay" doc theo day nhu ban truoc (do truoc day tinh lai tu dau moi frame theo do
            //    dai cung thuc te, ma do dai nay bien thien lien tuc vi soi day dong dua).
            function computeDashBreakpoints(x0, y0, cp1x, cp1y, cp2x, cp2y, x1, y1, dashLen, gapLen) {
                const SEGMENTS = 200;
                let breakpoints = [0];
                let prev = bezierPointAt(0, x0, y0, cp1x, cp1y, cp2x, cp2y, x1, y1);
                let dashOn = true;
                let dashRemaining = dashLen;

                for (let i = 1; i <= SEGMENTS; i++) {
                    const t = i / SEGMENTS;
                    const pt = bezierPointAt(t, x0, y0, cp1x, cp1y, cp2x, cp2y, x1, y1);
                    const segLen = Math.hypot(pt.x - prev.x, pt.y - prev.y);
                    dashRemaining -= segLen;
                    if (dashRemaining <= 0) {
                        breakpoints.push(t);
                        dashOn = !dashOn;
                        dashRemaining = dashOn ? dashLen : gapLen;
                    }
                    prev = pt;
                }
                breakpoints.push(1);
                return breakpoints; // t=0..breakpoints[1] la "on", breakpoints[1]..breakpoints[2] la "off", xen ke
            }

            // === VE NET DUT THEO MOC THAM SO CO DINH, NHUNG DUNG TOA DO SONG (LIVE) MOI FRAME ===
            function drawDashedFromBreakpoints(g, breakpoints, x0, y0, cp1x, cp1y, cp2x, cp2y, x1, y1, lineWidth, color, alpha) {
                g.lineStyle(lineWidth, color, alpha);
                for (let i = 0; i < breakpoints.length - 1; i++) {
                    const isOn = (i % 2 === 0); // bat dau tu "on"
                    if (!isOn) continue;
                    const tStart = breakpoints[i];
                    const tEnd = breakpoints[i + 1];
                    // Chia nho doan [tStart,tEnd] thanh vai buoc de bam sat duong cong (khong chi 1 doan thang)
                    const STEPS = 3;
                    const p0 = bezierPointAt(tStart, x0, y0, cp1x, cp1y, cp2x, cp2y, x1, y1);
                    g.moveTo(p0.x, p0.y);
                    for (let s = 1; s <= STEPS; s++) {
                        const t = tStart + (tEnd - tStart) * (s / STEPS);
                        const p = bezierPointAt(t, x0, y0, cp1x, cp1y, cp2x, cp2y, x1, y1);
                        g.lineTo(p.x, p.y);
                    }
                }
            }

            function setupThreads() {
                const minY = THREAD_MIN_Y, maxY = THREAD_MAX_Y;
                const numThreads = THREAD_COUNT;
                const stepY = (maxY - minY) / (numThreads + 1);

                const leftAnchors = [];
                const rightAnchors = [];
                for (let i = 1; i <= numThreads; i++) {
                    const targetY = Math.round(minY + stepY * i);
                    leftAnchors.push({ x: 510, y: targetY });
                    rightAnchors.push({ x: 620, y: targetY });
                }
                for (let i = rightAnchors.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rightAnchors[i], rightAnchors[j]] = [rightAnchors[j], rightAnchors[i]];
                }

                threads = [];
                for (let i = 0; i < numThreads; i++) {
                    const pLeft = leftAnchors[i];
                    const pRight = rightAnchors[i];
                    const initialDist = Math.hypot(pRight.x - pLeft.x, pRight.y - pLeft.y);
                    const totalLength = initialDist + MIN_EXTRA_LENGTH;
                    const curveFactor1 = (Math.random() - 0.5) * 1.5;
                    const curveFactor2 = (Math.random() - 0.5) * 1.5;
                    const phaseShift = Math.random() * Math.PI * 2;

                    // Tinh mot hinh dang "dai dien" (offset=0, thoi diem t=0) chi de lam co so
                    // tinh moc dash CO DINH theo tham so t - khong dung de ve thuc te.
                    const nomLx = pLeft.x, nomLy = pLeft.y, nomRx = pRight.x, nomRy = pRight.y;
                    const nomStraightDist = initialDist;
                    const nomSlack = Math.max(0, totalLength - nomStraightDist);
                    const nomSagDepth = Math.pow(nomSlack, 0.78) * 0.7;
                    const nomPulse = Math.sin(phaseShift) * 3 * (2.5 + 0.5 * Math.sin(i));
                    const nomCp1x = nomLx + (nomRx - nomLx) * 0.35 + (curveFactor1 * nomSagDepth * 0.25);
                    const nomCp1y = nomLy + nomSagDepth * 0.8 + nomPulse + (curveFactor1 * 20);
                    const nomCp2x = nomLx + (nomRx - nomLx) * 0.65 + (curveFactor2 * nomSagDepth * 0.25);
                    const nomCp2y = nomRy + nomSagDepth * 0.8 - nomPulse + (curveFactor2 * 20);

                    threads.push({
                        localLeftX: pLeft.x, localLeftY: pLeft.y,
                        localRightX: pRight.x, localRightY: pRight.y,
                        totalLength,
                        curveFactor1, curveFactor2, phaseShift,
                        baseColor: YARN_COLORS[i % YARN_COLORS.length],
                        dashBreakpoints1: computeDashBreakpoints(nomLx, nomLy, nomCp1x, nomCp1y, nomCp2x, nomCp2y, nomRx, nomRy, 4, 3),
                        dashBreakpoints2: computeDashBreakpoints(nomLx, nomLy, nomCp1x, nomCp1y, nomCp2x, nomCp2y, nomRx, nomRy, 2, 5),
                    });
                }

                yarnGraphics = new PIXI.Graphics();
                threadsLeftMaskSprite = new PIXI.Sprite(textures.leftMask);
                threadsLeftMaskSprite.blendMode = PIXI.BLEND_MODES.ERASE;
                threadsContainer = new PIXI.Container();
                threadsContainer.addChild(yarnGraphics, threadsLeftMaskSprite);
            }

            function drawYarnThreads(g, time) {
                g.clear();
                threads.forEach((t, index) => {
                    const lx = t.localLeftX - currentOffset;
                    const ly = t.localLeftY;
                    const rx = t.localRightX + currentOffset;
                    const ry = t.localRightY;

                    const straightDist = Math.hypot(rx - lx, ry - ly);
                    const slack = Math.max(0, t.totalLength - straightDist);
                    const sagDepth = Math.pow(slack, 0.78) * 0.7;

                    const pulseMulplier = 2.5 + 0.5 * Math.sin(time * 0.002 + index);
                    const pulse = Math.sin(time * 0.003 + t.phaseShift) * 3 * pulseMulplier;

                    const cp1x = lx + (rx - lx) * 0.35 + (t.curveFactor1 * sagDepth * 0.25);
                    const cp1y = ly + sagDepth * 0.8 + pulse + (t.curveFactor1 * 20);
                    const cp2x = lx + (rx - lx) * 0.65 + (t.curveFactor2 * sagDepth * 0.25);
                    const cp2y = ry + sagDepth * 0.8 - pulse + (t.curveFactor2 * 20);

                    // 1. Bong do
                    g.lineStyle(5, 0x000000, 0.4);
                    g.moveTo(lx, ly + 4);
                    g.bezierCurveTo(cp1x, cp1y + 4, cp2x, cp2y + 4, rx, ry + 4);

                    // 2. Than day len chinh (co bo tron dau net, giong lineCap='round' cua ban goc)
                    g.lineStyle({ width: 4.5, color: t.baseColor, alpha: 1, cap: PIXI.LINE_CAP.ROUND, join: PIXI.LINE_JOIN.ROUND });
                    g.moveTo(lx, ly);
                    g.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, rx, ry);

                    // 3. Vien sang net dut - dung MOC CO DINH (khong tinh lai theo do dai moi frame)
                    drawDashedFromBreakpoints(g, t.dashBreakpoints1, lx, ly, cp1x, cp1y, cp2x, cp2y, rx, ry, 2, 0xffffff, 0.25);

                    // 4. Lop toi net dut tao cam giac xoan - cung dung moc co dinh
                    drawDashedFromBreakpoints(g, t.dashBreakpoints2, lx - 1, ly - 1, cp1x - 1, cp1y - 1, cp2x - 1, cp2y - 1, rx - 1, ry - 1, 2, 0x000000, 0.3);

                    // 5. Fuzz
                    g.lineStyle(1, t.baseColor, 0.6);
                    const samples = 15;
                    for (let i = 1; i < samples; i++) {
                        const u = i / samples;
                        const px = Math.pow(1 - u, 3) * lx + 3 * Math.pow(1 - u, 2) * u * cp1x + 3 * (1 - u) * u * u * cp2x + u * u * u * rx;
                        const py = Math.pow(1 - u, 3) * ly + 3 * Math.pow(1 - u, 2) * u * cp1y + 3 * (1 - u) * u * u * cp2y + u * u * u * ry;
                        const fuzzAngle = (index + i * 17) % (Math.PI * 2);
                        const fuzzLen = 2.5 + ((i + index) % 3);
                        g.moveTo(px, py);
                        g.lineTo(px + Math.cos(fuzzAngle) * fuzzLen, py + Math.sin(fuzzAngle) * fuzzLen);
                    }
                });
            }

            // ==========================================
            // 7) HIEU UNG PHIM CU: PRE-RENDER 10 FRAME NHIEU/VET XUOC/VIGNETTE (canvas 2D,
            //    nhung chi lam MOT LAN luc khoi tao, sau do upload thanh PIXI.Texture, GPU chi blit).
            // ==========================================
            const FILM_FRAME_COUNT = 10;
            const filmTextures = [];
            let currentFilmFrameIndex = 0;
            let lastFrameChangeTime = 0;
            let filmSprite;

            function initFilmTextures() {
                for (let f = 0; f < FILM_FRAME_COUNT; f++) {
                    const c = document.createElement('canvas');
                    c.width = STAGE_W; c.height = STAGE_H;
                    const fCtx = c.getContext('2d');

                    fCtx.fillStyle = 'rgba(112, 66, 20, 0.12)';
                    fCtx.fillRect(0, 0, STAGE_W, STAGE_H);

                    const noiseData = fCtx.createImageData(STAGE_W, STAGE_H);
                    const data = noiseData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        if (Math.random() < 0.12) {
                            const n = Math.random() * 255;
                            data[i] = n; data[i + 1] = n; data[i + 2] = n; data[i + 3] = 16;
                        }
                    }
                    fCtx.putImageData(noiseData, 0, 0);

                    const scratchCount = Math.floor(Math.random() * 2) + 2;
                    for (let s = 0; s < scratchCount; s++) {
                        const sx = Math.random() * STAGE_W;
                        fCtx.strokeStyle = `rgba(15, 15, 15, ${0.15 + Math.random() * 0.25})`;
                        fCtx.lineWidth = 0.6 + Math.random() * 1.2;
                        fCtx.beginPath();
                        fCtx.moveTo(sx + (Math.random() - 0.5) * 3, 0);
                        fCtx.lineTo(sx + (Math.random() - 0.5) * 3, STAGE_H);
                        fCtx.stroke();
                    }

                    const dustCount = Math.floor(Math.random() * 14) + 4;
                    fCtx.fillStyle = 'rgba(10, 10, 10, 0.65)';
                    for (let d = 0; d < dustCount; d++) {
                        fCtx.beginPath();
                        fCtx.arc(Math.random() * STAGE_W, Math.random() * STAGE_H, 0.8 + Math.random() * 1.5, 0, Math.PI * 2);
                        fCtx.fill();
                    }

                    if (Math.random() < 0.4) {
                        fCtx.strokeStyle = 'rgba(10, 10, 10, 0.75)';
                        fCtx.lineWidth = 1.0;
                        const hx = Math.random() * STAGE_W;
                        const hy = Math.random() * STAGE_H;
                        fCtx.beginPath();
                        fCtx.moveTo(hx, hy);
                        fCtx.quadraticCurveTo(hx + 10, hy + 15, hx + (Math.random() - 0.5) * 30, hy + 25);
                        fCtx.stroke();
                    }

                    const vigGrad = fCtx.createRadialGradient(600, 450, 380, 600, 450, 720);
                    vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
                    vigGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.35)');
                    vigGrad.addColorStop(0.92, 'rgba(10, 10, 10, 0.8)');
                    vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.98)');
                    fCtx.fillStyle = vigGrad;
                    fCtx.fillRect(0, 0, STAGE_W, STAGE_H);

                    fCtx.lineWidth = 20;
                    fCtx.strokeStyle = 'rgba(0, 0, 0, 0.95)';
                    fCtx.strokeRect(0, 0, STAGE_W, STAGE_H);

                    filmTextures.push(PIXI.Texture.from(c));
                }
                filmSprite = new PIXI.Sprite(filmTextures[0]);
            }

            // ==========================================
            // 8) LAP RAP SCENE GRAPH (THU TU LOP GIONG HET BAN CANVAS 2D)
            // ==========================================
            function onAllLoaded() {
                leftAlpha = buildAlphaMap(rawImages.left);
                rightAlpha = buildAlphaMap(rawImages.right);

                buildCompositors();
                buildEyes();
                setupThreads();
                initFilmTextures();
                rebuildStaticLayersIfNeeded(true);

                const bgSprite = new PIXI.Sprite(textures.bg);
                const shadeMaskedSprite = new PIXI.Sprite(shadeRT);
                const insideMaskedSprite = new PIXI.Sprite(insideRT);
                const threadsMaskedSprite = new PIXI.Sprite(threadsRT);
                const shadowSpriteOnStage = new PIXI.Sprite(shadowRT);
                shadowSpriteOnStage.blendMode = PIXI.BLEND_MODES.MULTIPLY;
                const leftRightSpriteOnStage = new PIXI.Sprite(leftRightRT);

                app.stage.addChild(bgSprite);           // 1. Nen
                app.stage.addChild(shadeMaskedSprite);   // 2. Shade bi che
                app.stage.addChild(insideMaskedSprite);  // 3. Inside bi che
                extraEyeEntries.forEach(e => app.stage.addChild(e.resultSprite)); // 4. Mat phu
                app.stage.addChild(eyeResultSprite);     // 5. Mat chinh
                app.stage.addChild(threadsMaskedSprite); // 6. Day len
                app.stage.addChild(shadowSpriteOnStage); // 7. Bong do (multiply)
                app.stage.addChild(leftRightSpriteOnStage); // 8. Left/Right
                app.stage.addChild(filmSprite);          // 9. Phim cu

                // === FPS COUNTER DE BAN SO SANH TRUC TIEP VOI BAN CANVAS 2D ===
                let frames = 0, fpsTimer = 0;

                app.ticker.add((delta) => {
                    const now = performance.now();
                    const dt = app.ticker.deltaMS;

                    // Lerp mat chinh + mat phu
                    currentEye.x += (targetEye.x - currentEye.x) * 0.15;
                    currentEye.y += (targetEye.y - currentEye.y) * 0.15;
                    eyeContentSprite.position.set(currentEye.x, currentEye.y);

                    extraEyesConfig.forEach((cfg, idx) => {
                        if (now > cfg.nextChangeTime) {
                            const angle = Math.random() * Math.PI * 2;
                            const dist = 0.2 + Math.random();
                            const unrotatedX = Math.cos(angle) * cfg.radiusX * dist;
                            const unrotatedY = Math.sin(angle) * cfg.radiusY * dist;
                            cfg.targetX = unrotatedX * Math.cos(cfg.rotation) - unrotatedY * Math.sin(cfg.rotation);
                            cfg.targetY = unrotatedX * Math.sin(cfg.rotation) + unrotatedY * Math.cos(cfg.rotation);
                            cfg.nextChangeTime = now + 500 + Math.random() * 2500;
                        }
                        cfg.currX += (cfg.targetX - cfg.currX) * 0.08;
                        cfg.currY += (cfg.targetY - cfg.currY) * 0.08;
                        extraEyeEntries[idx].contentSprite.position.set(cfg.currX, cfg.currY);
                    });

                    // Ve lai RenderTexture cua mat chinh + 11 mat phu (SRC_IN, giong het canvas source-in)
                    renderEyesThisFrame();

                    // Cac lop tinh theo offset: chi rebuild khi offset doi
                    rebuildStaticLayersIfNeeded(false);

                    // Day len: animate moi frame (van can render lai RT vi co chuyen dong)
                    drawYarnThreads(yarnGraphics, now);
                    threadsLeftMaskSprite.x = -currentOffset;
                    app.renderer.render(threadsContainer, { renderTexture: threadsRT, clear: true });
                    threadsMaskedSprite.texture = threadsRT;

                    // Phim cu: doi frame ~12.5fps + rung nhe
                    if (now - lastFrameChangeTime > 80) {
                        currentFilmFrameIndex = (currentFilmFrameIndex + 1) % FILM_FRAME_COUNT;
                        lastFrameChangeTime = now;
                    }
                    filmSprite.texture = filmTextures[currentFilmFrameIndex];
                    filmSprite.y = (Math.random() - 0.5) * 1.2;
                    filmSprite.alpha = Math.random() < 0.3 ? (0.92 + Math.random() * 0.08) : 1;

                    // FPS counter
                    frames++;
                    fpsTimer += dt;
                    if (fpsTimer >= 500) {
                        fpsEl.textContent = 'FPS: ' + Math.round((frames * 1000) / fpsTimer);
                        frames = 0;
                        fpsTimer = 0;
                    }
                });
            }

            // ==========================================
            // 9) INPUT: GIU NGUYEN LOGIC KEO THA + HIT-TEST NHU BAN CU
            // ==========================================
            function getStagePos(e) {
                const rect = app.view.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (STAGE_W / rect.width),
                    y: (clientY - rect.top) * (STAGE_H / rect.height)
                };
            }

            function checkHitRegion(x, y) {
                const px = Math.floor(x), py = Math.floor(y);
                if (px < 0 || px >= STAGE_W || py < 0 || py >= STAGE_H) return null;
                if (!leftAlpha || !rightAlpha) return null;

                const leftSrcX = px + currentOffset;
                if (leftSrcX >= 0 && leftSrcX < STAGE_W) {
                    if (leftAlpha[py * STAGE_W + leftSrcX] > 10) return 'left';
                }
                const rightSrcX = px - currentOffset;
                if (rightSrcX >= 0 && rightSrcX < STAGE_W) {
                    if (rightAlpha[py * STAGE_W + rightSrcX] > 10) return 'right';
                }
                return null;
            }

            function onPointerDown(e) {
                const pos = getStagePos(e);
                const hitTarget = checkHitRegion(pos.x, pos.y);
                if (hitTarget) {
                    isDragging = true;
                    dragSource = hitTarget;
                    startStageX = pos.x;
                    dragStartOffset = currentOffset;
                    stageEl.style.cursor = 'grabbing';
                }
            }

            function onPointerMove(e) {
                const pos = getStagePos(e);
                updateEyePosition(pos.x, pos.y);

                if (!isDragging) {
                    const hitTarget = checkHitRegion(pos.x, pos.y);
                    stageEl.style.cursor = hitTarget ? 'grab' : 'default';
                    return;
                }

                const deltaStageX = pos.x - startStageX;
                let newOffset = (dragSource === 'left') ? dragStartOffset - deltaStageX : dragStartOffset + deltaStageX;
                currentOffset = Math.max(0, Math.min(MAX_DRAG_DIST, newOffset));
            }

            function onPointerUp() {
                if (isDragging) {
                    isDragging = false;
                    dragSource = null;
                    stageEl.style.cursor = 'default';
                }
            }

            function updateEyePosition(cursorX, cursorY) {
                const dx = cursorX - EYE_CONFIG.centerX;
                const dy = cursorY - EYE_CONFIG.centerY;
                const percentX = Math.max(-1, Math.min(1, dx / EYE_CONFIG.centerX));
                const percentY = Math.max(-1, Math.min(1, dy / EYE_CONFIG.centerY));
                let rawTargetX = percentX * EYE_CONFIG.maxRadius;
                let rawTargetY = percentY * EYE_CONFIG.maxRadius;
                const distFromCenter = Math.hypot(rawTargetX, rawTargetY);
                if (distFromCenter > EYE_CONFIG.maxRadius) {
                    const angle = Math.atan2(rawTargetY, rawTargetX);
                    rawTargetX = Math.cos(angle) * EYE_CONFIG.maxRadius;
                    rawTargetY = Math.sin(angle) * EYE_CONFIG.maxRadius;
                }
                targetEye.x = rawTargetX;
                targetEye.y = rawTargetY;
            }

            stageEl.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            stageEl.addEventListener('touchstart', onPointerDown, { passive: true });
            window.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);
        })();
    </script>
