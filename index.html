<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vincent</title>

    <style>
        :root {
            --w: 1200;
            --h: 900;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: #111;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .stage-wrap {
            width: min(100%, calc((100vh - 32px) * (var(--w) / var(--h))));
            max-width: calc(var(--w) * 1px);
            min-width: 200px;
            margin: 0 auto;
        }

        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: var(--w) / var(--h);
            overflow: hidden;
            border-radius: 14px;
            background: #1c1c1c;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
            touch-action: none;
            user-select: none;
        }

        #mainCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="stage-wrap">
        <div class="stage" id="stage">
            <canvas id="mainCanvas" width="1200" height="900"></canvas>
        </div>
    </div>
    <script src="imagesData.js"></script>
    <script>
        (function () {
            const stage = document.getElementById('stage');
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');

            // --- CÁC OFFSCREEN CANVAS NGUYÊN BẢN CỦA BẠN ---
            const eyeClipCanvas = createOffscreenCanvas();
            const eyeClipCtx = eyeClipCanvas.getContext('2d');

            const extraEyeClipCanvas = createOffscreenCanvas();
            const extraEyeClipCtx = extraEyeClipCanvas.getContext('2d');

            const insideMaskCanvas = createOffscreenCanvas();
            const insideMaskCtx = insideMaskCanvas.getContext('2d');

            const shadeMaskCanvas = createOffscreenCanvas();
            const shadeMaskCtx = shadeMaskCanvas.getContext('2d');

            const threadsCanvas = createOffscreenCanvas();
            const threadsCtx = threadsCanvas.getContext('2d');

            function createOffscreenCanvas() {
                const c = document.createElement('canvas');
                c.width = 1200;
                c.height = 900;
                return c;
            }

            // ==========================================
            // TỐI ƯU 1: TRA CỨU ALPHA HIT-TEST NGUYÊN BẢN O(1)
            // ==========================================
            const alphaDataMaps = {
                left: new Uint8Array(1200 * 900),
                right: new Uint8Array(1200 * 900)
            };

            function buildAlphaMap(key, imgElement) {
                const offCanvas = createOffscreenCanvas();
                const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
                offCtx.drawImage(imgElement, 0, 0, 1200, 900);
                const rawData = offCtx.getImageData(0, 0, 1200, 900).data;
                const targetArray = alphaDataMaps[key];

                for (let i = 0; i < targetArray.length; i++) {
                    targetArray[i] = rawData[i * 4 + 3];
                }
            }

            function checkHitRegion(px, py) {
                const x = Math.floor(px);
                const y = Math.floor(py);

                if (x < 0 || x >= 1200 || y < 0 || y >= 900) return null;

                const leftX = x + Math.floor(currentOffset);
                if (leftX >= 0 && leftX < 1200) {
                    if (alphaDataMaps.left[y * 1200 + leftX] > 10) return 'left';
                }

                const rightX = x - Math.floor(currentOffset);
                if (rightX >= 0 && rightX < 1200) {
                    if (alphaDataMaps.right[y * 1200 + rightX] > 10) return 'right';
                }

                return null;
            }

            // ==========================================
            // TỐI ƯU 2: CỐ ĐỊNH FILM NOISE ĐỂ XÓA TÌNH TRẠNG NHẤP NHÁY
            // ==========================================
            const FILM_FRAME_COUNT = 4;
            const filmFrames = [];
            let currentFilmFrameIndex = 0;
            let lastFrameChangeTime = 0;

            function initFilmEffect() {
                for (let f = 0; f < FILM_FRAME_COUNT; f++) {
                    const fCanvas = createOffscreenCanvas();
                    const fCtx = fCanvas.getContext('2d');

                    fCtx.fillStyle = 'rgba(112, 66, 20, 0.12)';
                    fCtx.fillRect(0, 0, 1200, 900);

                    const noiseData = fCtx.createImageData(1200, 900);
                    const data = noiseData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        if (Math.random() < 0.08) {
                            const n = Math.random() * 255;
                            data[i] = n;
                            data[i + 1] = n;
                            data[i + 2] = n;
                            data[i + 3] = 12;
                        }
                    }
                    fCtx.putImageData(noiseData, 0, 0);

                    const scratchCount = Math.floor(Math.random() * 2) + 1;
                    for (let s = 0; s < scratchCount; s++) {
                        const sx = Math.random() * 1200;
                        fCtx.strokeStyle = `rgba(15, 15, 15, ${0.12 + Math.random() * 0.15})`;
                        fCtx.lineWidth = 0.8;
                        fCtx.beginPath();
                        fCtx.moveTo(sx, 0);
                        fCtx.lineTo(sx + (Math.random() - 0.5) * 3, 900);
                        fCtx.stroke();
                    }

                    const vigGrad = fCtx.createRadialGradient(600, 450, 380, 600, 450, 720);
                    vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
                    vigGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.35)');
                    vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.95)');

                    fCtx.fillStyle = vigGrad;
                    fCtx.fillRect(0, 0, 1200, 900);

                    filmFrames.push(fCanvas);
                }
            }

            function drawOldFilmEffect(now) {
                if (now - lastFrameChangeTime > 120) { // Chuyển frame chậm lại để hết giật
                    currentFilmFrameIndex = (currentFilmFrameIndex + 1) % FILM_FRAME_COUNT;
                    lastFrameChangeTime = now;
                }

                ctx.save();
                ctx.drawImage(filmFrames[currentFilmFrameIndex], 0, 0, 1200, 900);
                ctx.restore();
            }

            // --- BẢO TỒN NGUYÊN BẢN CẤU HÌNH & TƯƠNG TÁC ---
            const EYE_CONFIG = { centerX: 600, centerY: 355, maxRadius: 10 };
            const MAX_DRAG_DIST = 190;
            const MIN_EXTRA_LENGTH = 2000;
            const THREAD_COUNT = 7;
            const THREAD_MIN_Y = 150;
            const THREAD_MAX_Y = 800;
            const YARN_COLORS = ['#9D1C14', '#C41B0D', '#D95505'];

            let isDragging = false;
            let dragSource = null;
            let startStageX = 0;
            let currentOffset = 0;
            let dragStartOffset = 0;

            let targetEye = { x: 0, y: 0 };
            let currentEye = { x: 0, y: 0 };

            const images = {};
            const imageSources = {
                bg: IMAGE_DATA.Background,
                shade: IMAGE_DATA.Shade,
                inside: IMAGE_DATA.Inside,
                eyeBound: IMAGE_DATA.Eye_Cursor_Bound,
                eye: IMAGE_DATA.Eye_Cursor,
                leftShadow: IMAGE_DATA.Left_Shadow,
                rightShadow: IMAGE_DATA.Right_Shadow,
                left: IMAGE_DATA.Left,
                right: IMAGE_DATA.Right,
                leftMask: IMAGE_DATA.Left_Mask,
                rightMask: IMAGE_DATA.Right_Mask,
            };

            const EXTRA_EYES_COUNT = 11;
            for (let i = 1; i <= EXTRA_EYES_COUNT; i++) {
                const numStr = String(i).padStart(2, '0');
                imageSources[`eye_${numStr}`] = IMAGE_DATA[`Eye_${numStr}`];
                imageSources[`eye_${numStr}_bound`] = IMAGE_DATA[`Eye_${numStr}_Bound`];
            }

            const extraEyesConfig = [
                { id: '01', radiusX: 12, radiusY: 8, rotation: -30 * Math.PI / 180 },
                { id: '02', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '03', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '04', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '05', radiusX: 12, radiusY: 8, rotation: -35 * Math.PI / 180 },
                { id: '06', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '07', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '08', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '09', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '10', radiusX: 12, radiusY: 8, rotation: -40 * Math.PI / 180 },
                { id: '11', radiusX: 12, radiusY: 8, rotation: -20 * Math.PI / 180 },
            ].map(cfg => ({
                ...cfg, currX: 0, currY: 0, targetX: 0, targetY: 0, nextChangeTime: 0
            }));

            let loadedCount = 0;
            const totalImages = Object.keys(imageSources).length;
            let threads = [];

            for (let key in imageSources) {
                images[key] = new Image();
                images[key].src = imageSources[key];
                images[key].onload = () => {
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        init();
                    }
                };
            }

            function init() {
                buildAlphaMap('left', images.left);
                buildAlphaMap('right', images.right);
                initFilmEffect();
                setupThreads();
                requestAnimationFrame(renderLoop);
            }

            function setupThreads() {
                const minY = THREAD_MIN_Y, maxY = THREAD_MAX_Y;
                const numThreads = THREAD_COUNT;
                const stepY = (maxY - minY) / (numThreads + 1);

                const leftAnchors = [];
                const rightAnchors = [];

                for (let i = 1; i <= numThreads; i++) {
                    const targetY = Math.round(minY + stepY * i);
                    leftAnchors.push({ x: 510, y: targetY });
                    rightAnchors.push({ x: 620, y: targetY });
                }

                for (let i = rightAnchors.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rightAnchors[i], rightAnchors[j]] = [rightAnchors[j], rightAnchors[i]];
                }

                threads = [];
                for (let i = 0; i < numThreads; i++) {
                    const pLeft = leftAnchors[i];
                    const pRight = rightAnchors[i];
                    const initialDist = Math.hypot(pRight.x - pLeft.x, pRight.y - pLeft.y);

                    threads.push({
                        localLeftX: pLeft.x,
                        localLeftY: pLeft.y,
                        localRightX: pRight.x,
                        localRightY: pRight.y,
                        totalLength: initialDist + MIN_EXTRA_LENGTH,
                        curveFactor1: (Math.random() - 0.5) * 1.5,
                        curveFactor2: (Math.random() - 0.5) * 1.5,
                        phaseShift: Math.random() * Math.PI * 2,
                        baseColor: YARN_COLORS[i % YARN_COLORS.length]
                    });
                }
            }

            // --- NGUYÊN BẢN TOÀN BỘ CÁC HÀM VẼ & TẮT LỚP MASK (Z-INDEX NGUYÊN THỦY) ---
            function drawYarnThreads(targetCtx, time) {
                threads.forEach((t, index) => {
                    const lx = t.localLeftX - currentOffset;
                    const ly = t.localLeftY;
                    const rx = t.localRightX + currentOffset;
                    const ry = t.localRightY;

                    const straightDist = Math.hypot(rx - lx, ry - ly);
                    const slack = Math.max(0, t.totalLength - straightDist);
                    const sagDepth = Math.pow(slack, 0.78) * 0.7;

                    const pulseMulplier = 2.5 + 0.5 * Math.sin(time * 0.002 + index);
                    const pulse = Math.sin(time * 0.003 + t.phaseShift) * 3 * pulseMulplier;

                    const cp1x = lx + (rx - lx) * 0.35 + (t.curveFactor1 * sagDepth * 0.25);
                    const cp1y = ly + sagDepth * 0.8 + pulse + (t.curveFactor1 * 20);

                    const cp2x = lx + (rx - lx) * 0.65 + (t.curveFactor2 * sagDepth * 0.25);
                    const cp2y = ry + sagDepth * 0.8 - pulse + (t.curveFactor2 * 20);

                    targetCtx.save();

                    targetCtx.beginPath();
                    targetCtx.moveTo(lx, ly + 4);
                    targetCtx.bezierCurveTo(cp1x, cp1y + 4, cp2x, cp2y + 4, rx, ry + 4);
                    targetCtx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    targetCtx.lineWidth = 4;
                    targetCtx.stroke();

                    targetCtx.beginPath();
                    targetCtx.moveTo(lx, ly);
                    targetCtx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, rx, ry);
                    targetCtx.strokeStyle = t.baseColor;
                    targetCtx.lineWidth = 4;
                    targetCtx.lineCap = 'round';
                    targetCtx.stroke();

                    targetCtx.setLineDash([4, 4]);
                    targetCtx.beginPath();
                    targetCtx.moveTo(lx, ly);
                    targetCtx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, rx, ry);
                    targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    targetCtx.lineWidth = 2;
                    targetCtx.stroke();

                    targetCtx.restore();
                });
            }

            function drawMaskedThreads(time) {
                threadsCtx.clearRect(0, 0, 1200, 900);
                drawYarnThreads(threadsCtx, time);

                threadsCtx.globalCompositeOperation = 'destination-out';
                threadsCtx.drawImage(images.leftMask, -currentOffset, 0, 1200, 900);
                threadsCtx.globalCompositeOperation = 'source-over';

                ctx.drawImage(threadsCanvas, 0, 0, 1200, 900);
            }

            function drawMaskedShade() {
                shadeMaskCtx.clearRect(0, 0, 1200, 900);
                shadeMaskCtx.drawImage(images.shade, -currentOffset, 0, 1200, 900);

                shadeMaskCtx.globalCompositeOperation = 'destination-out';
                shadeMaskCtx.drawImage(images.rightMask, currentOffset, 0, 1200, 900);
                shadeMaskCtx.globalCompositeOperation = 'source-over';

                ctx.drawImage(shadeMaskCanvas, 0, 0, 1200, 900);
            }

            function drawMaskedInside() {
                insideMaskCtx.clearRect(0, 0, 1200, 900);
                insideMaskCtx.drawImage(images.inside, 0, 0, 1200, 900);

                insideMaskCtx.globalCompositeOperation = 'destination-out';
                insideMaskCtx.drawImage(images.leftMask, -currentOffset, 0, 1200, 900);
                insideMaskCtx.drawImage(images.rightMask, currentOffset, 0, 1200, 900);
                insideMaskCtx.globalCompositeOperation = 'source-over';

                ctx.drawImage(insideMaskCanvas, 0, 0, 1200, 900);
            }

            function drawClippedEye() {
                eyeClipCtx.clearRect(0, 0, 1200, 900);
                eyeClipCtx.drawImage(images.eyeBound, 0, 0, 1200, 900);
                eyeClipCtx.globalCompositeOperation = 'source-in';
                eyeClipCtx.drawImage(images.eye, currentEye.x, currentEye.y, 1200, 900);
                eyeClipCtx.globalCompositeOperation = 'source-over';

                ctx.drawImage(eyeClipCanvas, 0, 0, 1200, 900);
            }

            function updateAndDrawExtraEyes(now) {
                extraEyesConfig.forEach(cfg => {
                    if (now > cfg.nextChangeTime) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 0.2 + Math.random();

                        const unrotatedX = Math.cos(angle) * cfg.radiusX * dist;
                        const unrotatedY = Math.sin(angle) * cfg.radiusY * dist;

                        cfg.targetX = unrotatedX * Math.cos(cfg.rotation) - unrotatedY * Math.sin(cfg.rotation);
                        cfg.targetY = unrotatedX * Math.sin(cfg.rotation) + unrotatedY * Math.cos(cfg.rotation);
                        cfg.nextChangeTime = now + 600 + Math.random() * 2400;
                    }

                    cfg.currX += (cfg.targetX - cfg.currX) * 0.1;
                    cfg.currY += (cfg.targetY - cfg.currY) * 0.1;

                    const eyeImg = images[`eye_${cfg.id}`];
                    const boundImg = images[`eye_${cfg.id}_bound`];

                    if (eyeImg && boundImg) {
                        extraEyeClipCtx.clearRect(0, 0, 1200, 900);
                        extraEyeClipCtx.drawImage(boundImg, 0, 0, 1200, 900);
                        extraEyeClipCtx.globalCompositeOperation = 'source-in';
                        extraEyeClipCtx.drawImage(eyeImg, cfg.currX, cfg.currY, 1200, 900);
                        extraEyeClipCtx.globalCompositeOperation = 'source-over';

                        ctx.drawImage(extraEyeClipCanvas, 0, 0, 1200, 900);
                    }
                });
            }

            function renderLoop(timestamp) {
                const now = timestamp || 0;
                ctx.clearRect(0, 0, 1200, 900);

                currentEye.x += (targetEye.x - currentEye.x) * 0.15;
                currentEye.y += (targetEye.y - currentEye.y) * 0.15;

                // THỨ TỰ RENDER ĐÚNG NGUYÊN BẢN CỦA BẠN:
                ctx.drawImage(images.bg, 0, 0, 1200, 900);

                drawMaskedShade();
                drawMaskedInside();
                updateAndDrawExtraEyes(now);
                drawClippedEye();
                drawMaskedThreads(now);

                ctx.save();
                ctx.globalCompositeOperation = 'multiply';
                ctx.drawImage(images.leftShadow, -currentOffset, 0, 1200, 900);
                ctx.drawImage(images.rightShadow, currentOffset, 0, 1200, 900);
                ctx.restore();

                ctx.drawImage(images.left, -currentOffset, 0, 1200, 900);
                ctx.drawImage(images.right, currentOffset, 0, 1200, 900);

                drawOldFilmEffect(now);

                requestAnimationFrame(renderLoop);
            }

            // --- HÀM XỬ LÝ SỰ KIỆN NGUYÊN BẢN ---
            function getStagePos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (1200 / rect.width),
                    y: (clientY - rect.top) * (900 / rect.height)
                };
            }

            function onPointerDown(e) {
                const pos = getStagePos(e);
                const hitTarget = checkHitRegion(pos.x, pos.y);

                if (hitTarget) {
                    isDragging = true;
                    dragSource = hitTarget;
                    startStageX = pos.x;
                    dragStartOffset = currentOffset;
                    stage.style.cursor = 'grabbing';
                }
            }

            function onPointerMove(e) {
                const pos = getStagePos(e);
                updateEyePosition(pos.x, pos.y);

                if (!isDragging) {
                    const hitTarget = checkHitRegion(pos.x, pos.y);
                    stage.style.cursor = hitTarget ? 'grab' : 'default';
                    return;
                }

                const deltaStageX = pos.x - startStageX;

                let newOffset = (dragSource === 'left')
                    ? dragStartOffset - deltaStageX
                    : dragStartOffset + deltaStageX;

                currentOffset = Math.max(0, Math.min(MAX_DRAG_DIST, newOffset));
            }

            function onPointerUp() {
                if (isDragging) {
                    isDragging = false;
                    dragSource = null;
                    stage.style.cursor = 'default';
                }
            }

            function updateEyePosition(cursorX, cursorY) {
                const dx = cursorX - EYE_CONFIG.centerX;
                const dy = cursorY - EYE_CONFIG.centerY;

                const percentX = Math.max(-1, Math.min(1, dx / EYE_CONFIG.centerX));
                const percentY = Math.max(-1, Math.min(1, dy / EYE_CONFIG.centerY));

                let rawTargetX = percentX * EYE_CONFIG.maxRadius;
                let rawTargetY = percentY * EYE_CONFIG.maxRadius;

                const distFromCenter = Math.hypot(rawTargetX, rawTargetY);
                if (distFromCenter > EYE_CONFIG.maxRadius) {
                    const angle = Math.atan2(rawTargetY, rawTargetX);
                    rawTargetX = Math.cos(angle) * EYE_CONFIG.maxRadius;
                    rawTargetY = Math.sin(angle) * EYE_CONFIG.maxRadius;
                }

                targetEye.x = rawTargetX;
                targetEye.y = rawTargetY;
            }

            stage.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove, { passive: true });
            window.addEventListener('mouseup', onPointerUp);

            stage.addEventListener('touchstart', onPointerDown, { passive: true });
            window.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);
        })();
    </script>
</body>

</html>
