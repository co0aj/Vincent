<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vincent</title>

    <style>
        :root {
            --w: 1200;
            --h: 900;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: #111;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .stage-wrap {
            width: min(100%, calc((100vh - 32px) * (var(--w) / var(--h))));
            max-width: calc(var(--w) * 1px);
            min-width: 200px;
            margin: 0 auto;
        }

        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: var(--w) / var(--h);
            overflow: hidden;
            border-radius: 14px;
            background: #1c1c1c;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
            touch-action: none;
            user-select: none;
        }

        .gif-multiply {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transform-origin: center;
            will-change: transform;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: multiply;
        }

        #mainCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="stage-wrap">
        <div class="stage" id="stage">
            <canvas id="mainCanvas" width="1200" height="900"></canvas>
        </div>
    </div>
    <script src="imagesData.js"></script>
    <script>
        (function () {
            const stage = document.getElementById('stage');
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');

            // --- OFFSCREEN CANVAS CHO MASKING (KHONG DUNG CHO HIT-TEST NUA) ---
            const eyeClipCanvas = createOffscreenCanvas();
            const eyeClipCtx = eyeClipCanvas.getContext('2d');

            const extraEyeClipCanvas = createOffscreenCanvas();
            const extraEyeClipCtx = extraEyeClipCanvas.getContext('2d');

            const insideMaskCanvas = createOffscreenCanvas();
            const insideMaskCtx = insideMaskCanvas.getContext('2d');

            // Canvas phụ xử lý Shade + Right_Mask
            const shadeMaskCanvas = createOffscreenCanvas();
            const shadeMaskCtx = shadeMaskCanvas.getContext('2d');

            // Canvas phụ xử lý Dây Len + Left_Mask
            const threadsCanvas = createOffscreenCanvas();
            const threadsCtx = threadsCanvas.getContext('2d');

            // Canvas tạm 1 lần dùng để đọc alpha data khi ảnh vừa load xong
            const decodeCanvas = createOffscreenCanvas();
            const decodeCtx = decodeCanvas.getContext('2d', { willReadFrequently: true });

            function createOffscreenCanvas() {
                const c = document.createElement('canvas');
                c.width = 1200;
                c.height = 900;
                return c;
            }

            // ==========================================
            // PRE-RENDER FILM EFFECT (SIÊU TỐI ƯU HIỆU NĂNG)
            // ==========================================
            const FILM_FRAME_COUNT = 10;
            const filmFrames = [];
            let currentFilmFrameIndex = 0;
            let lastFrameChangeTime = 0;

            function initOptimizedFilmEffect() {
                for (let f = 0; f < FILM_FRAME_COUNT; f++) {
                    const fCanvas = createOffscreenCanvas();
                    const fCtx = fCanvas.getContext('2d');

                    fCtx.fillStyle = 'rgba(112, 66, 20, 0.12)';
                    fCtx.fillRect(0, 0, 1200, 900);

                    const noiseData = fCtx.createImageData(1200, 900);
                    const data = noiseData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        if (Math.random() < 0.12) {
                            const n = Math.random() * 255;
                            data[i] = n;
                            data[i + 1] = n;
                            data[i + 2] = n;
                            data[i + 3] = 16;
                        }
                    }
                    fCtx.putImageData(noiseData, 0, 0);

                    const scratchCount = Math.floor(Math.random() * 2) + 2;
                    for (let s = 0; s < scratchCount; s++) {
                        const sx = Math.random() * 1200;
                        fCtx.strokeStyle = `rgba(15, 15, 15, ${0.15 + Math.random() * 0.25})`;
                        fCtx.lineWidth = 0.6 + Math.random() * 1.2;
                        fCtx.beginPath();
                        fCtx.moveTo(sx + (Math.random() - 0.5) * 3, 0);
                        fCtx.lineTo(sx + (Math.random() - 0.5) * 3, 900);
                        fCtx.stroke();
                    }

                    const dustCount = Math.floor(Math.random() * 14) + 4;
                    fCtx.fillStyle = 'rgba(10, 10, 10, 0.65)';
                    for (let d = 0; d < dustCount; d++) {
                        fCtx.beginPath();
                        fCtx.arc(Math.random() * 1200, Math.random() * 900, 0.8 + Math.random() * 1.5, 0, Math.PI * 2);
                        fCtx.fill();
                    }

                    if (Math.random() < 0.4) {
                        fCtx.strokeStyle = 'rgba(10, 10, 10, 0.75)';
                        fCtx.lineWidth = 1.0;
                        const hx = Math.random() * 1200;
                        const hy = Math.random() * 900;
                        fCtx.beginPath();
                        fCtx.moveTo(hx, hy);
                        fCtx.quadraticCurveTo(hx + 10, hy + 15, hx + (Math.random() - 0.5) * 30, hy + 25);
                        fCtx.stroke();
                    }

                    const vigGrad = fCtx.createRadialGradient(600, 450, 380, 600, 450, 720);
                    vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
                    vigGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.35)');
                    vigGrad.addColorStop(0.92, 'rgba(10, 10, 10, 0.8)');
                    vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.98)');

                    fCtx.fillStyle = vigGrad;
                    fCtx.fillRect(0, 0, 1200, 900);

                    fCtx.lineWidth = 20;
                    fCtx.strokeStyle = 'rgba(0, 0, 0, 0.95)';
                    fCtx.strokeRect(0, 0, 1200, 900);

                    filmFrames.push(fCanvas);
                }
            }

            function drawOldFilmEffect(now) {
                if (now - lastFrameChangeTime > 80) {
                    currentFilmFrameIndex = (currentFilmFrameIndex + 1) % FILM_FRAME_COUNT;
                    lastFrameChangeTime = now;
                }

                ctx.save();
                const jitterY = (Math.random() - 0.5) * 1.2;

                if (Math.random() < 0.3) {
                    ctx.globalAlpha = 0.92 + Math.random() * 0.08;
                }

                ctx.drawImage(filmFrames[currentFilmFrameIndex], 0, jitterY, 1200, 900);
                ctx.restore();
            }

            // --- CẤU HÌNH LOGIC BAN ĐẦU ---
            const EYE_CONFIG = { centerX: 600, centerY: 355, maxRadius: 10 };
            const MAX_DRAG_DIST = 190;
            const MIN_EXTRA_LENGTH = 2000;
            const THREAD_COUNT = 7;
            const THREAD_MIN_Y = 150;
            const THREAD_MAX_Y = 800;

            const YARN_COLORS = ['#9D1C14', '#C41B0D', '#D95505'];

            let isDragging = false;
            let dragSource = null;
            let startStageX = 0;
            let currentOffset = 0;
            let dragStartOffset = 0;

            let targetEye = { x: 0, y: 0 };
            let currentEye = { x: 0, y: 0 };

            const images = {};

            const imageSources = {
                bg: IMAGE_DATA.Background,
                shade: IMAGE_DATA.Shade,
                inside: IMAGE_DATA.Inside,
                eyeBound: IMAGE_DATA.Eye_Cursor_Bound,
                eye: IMAGE_DATA.Eye_Cursor,
                leftShadow: IMAGE_DATA.Left_Shadow,
                rightShadow: IMAGE_DATA.Right_Shadow,
                left: IMAGE_DATA.Left,
                right: IMAGE_DATA.Right,
                leftMask: IMAGE_DATA.Left_Mask,
                rightMask: IMAGE_DATA.Right_Mask,
            };

            const EXTRA_EYES_COUNT = 11;
            for (let i = 1; i <= EXTRA_EYES_COUNT; i++) {
                const numStr = String(i).padStart(2, '0');
                imageSources[`eye_${numStr}`] = IMAGE_DATA[`Eye_${numStr}`];
                imageSources[`eye_${numStr}_bound`] = IMAGE_DATA[`Eye_${numStr}_Bound`];
            }

            const extraEyesConfig = [
                { id: '01', radiusX: 12, radiusY: 8, rotation: -30 * Math.PI / 180 },
                { id: '02', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '03', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '04', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '05', radiusX: 12, radiusY: 8, rotation: -35 * Math.PI / 180 },
                { id: '06', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '07', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '08', radiusX: 12, radiusY: 8, rotation: 0 },
                { id: '09', radiusX: 12, radiusY: 8, rotation: -45 * Math.PI / 180 },
                { id: '10', radiusX: 12, radiusY: 8, rotation: -40 * Math.PI / 180 },
                { id: '11', radiusX: 12, radiusY: 8, rotation: -20 * Math.PI / 180 },
            ].map(cfg => ({
                ...cfg,
                currX: 0,
                currY: 0,
                targetX: 0,
                targetY: 0,
                nextChangeTime: 0
            }));

            let loadedCount = 0;
            const totalImages = Object.keys(imageSources).length;
            let threads = [];

            // === FIX #1: HIT-TEST BANG MANG ALPHA TIEN TINH (khong dung getImageData moi frame) ===
            let leftAlpha = null;   // Uint8ClampedArray, alpha cua images.left tai vi tri goc (offset = 0)
            let rightAlpha = null;  // Uint8ClampedArray, alpha cua images.right tai vi tri goc (offset = 0)

            function buildAlphaMap(img) {
                decodeCtx.clearRect(0, 0, 1200, 900);
                decodeCtx.drawImage(img, 0, 0, 1200, 900);
                const data = decodeCtx.getImageData(0, 0, 1200, 900).data;
                const alpha = new Uint8ClampedArray(1200 * 900);
                for (let i = 0, j = 3; i < alpha.length; i++, j += 4) {
                    alpha[i] = data[j];
                }
                return alpha;
            }

            // === FIX #4: BOUNDING BOX CHO TUNG MAT - CHI COMPOSITE VUNG THUC SU CO PIXEL ===
            // Thay vi ve/composite tren toan bo 1200x900 cho MOI con mat (x11 lan + mat chinh),
            // ta tinh truoc vung chua pixel khong-trong-suot cua tung anh "bound", roi chi lam
            // viec trong vung nho do. Day la nguyen nhan chinh gay cham tren iPhone vi fill-rate
            // (so pixel phai to) tren canvas 2D cua Safari mobile rat han che.
            function computeBBox(img, padding) {
                if (padding === undefined) padding = 6;
                decodeCtx.clearRect(0, 0, 1200, 900);
                decodeCtx.drawImage(img, 0, 0, 1200, 900);
                const data = decodeCtx.getImageData(0, 0, 1200, 900).data;
                let minX = 1200, minY = 900, maxX = -1, maxY = -1;
                // Quet theo hang, bo qua nhanh cac hang/cot rong de nhanh hon
                for (let y = 0; y < 900; y++) {
                    const rowBase = y * 1200 * 4;
                    for (let x = 0; x < 1200; x++) {
                        if (data[rowBase + x * 4 + 3] > 10) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }
                if (maxX < 0) return { x: 0, y: 0, w: 1200, h: 900 }; // anh rong toan bo, fallback an toan
                minX = Math.max(0, minX - padding);
                minY = Math.max(0, minY - padding);
                maxX = Math.min(1199, maxX + padding);
                maxY = Math.min(899, maxY + padding);
                return { x: minX, y: minY, w: (maxX - minX + 1), h: (maxY - minY + 1) };
            }

            let eyeBoundBBox = null; // bbox cho mat chinh (Eye_Cursor_Bound)

            for (let key in imageSources) {
                images[key] = new Image();
                images[key].src = imageSources[key];
                images[key].onload = () => {
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        // Build cac alpha map va bounding box MOT LAN duy nhat, ngay khi anh load xong
                        leftAlpha = buildAlphaMap(images.left);
                        rightAlpha = buildAlphaMap(images.right);

                        eyeBoundBBox = computeBBox(images.eyeBound, 16); // padding rong hon vi mat chinh di chuyen +-10px

                        extraEyesConfig.forEach(cfg => {
                            const boundImg = images[`eye_${cfg.id}_bound`];
                            cfg.bbox = boundImg ? computeBBox(boundImg, 4) : { x: 0, y: 0, w: 1200, h: 900 };
                        });

                        init();
                    }
                };
            }

            function init() {
                initOptimizedFilmEffect();
                setupThreads();
                requestAnimationFrame(renderLoop);
            }

            function setupThreads() {
                const minY = THREAD_MIN_Y, maxY = THREAD_MAX_Y;
                const numThreads = THREAD_COUNT;
                const stepY = (maxY - minY) / (numThreads + 1);

                const leftAnchors = [];
                const rightAnchors = [];

                for (let i = 1; i <= numThreads; i++) {
                    const targetY = Math.round(minY + stepY * i);
                    leftAnchors.push({ x: 510, y: targetY });
                    rightAnchors.push({ x: 620, y: targetY });
                }

                for (let i = rightAnchors.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rightAnchors[i], rightAnchors[j]] = [rightAnchors[j], rightAnchors[i]];
                }

                threads = [];
                for (let i = 0; i < numThreads; i++) {
                    const pLeft = leftAnchors[i];
                    const pRight = rightAnchors[i];
                    const initialDist = Math.hypot(pRight.x - pLeft.x, pRight.y - pLeft.y);

                    threads.push({
                        localLeftX: pLeft.x,
                        localLeftY: pLeft.y,
                        localRightX: pRight.x,
                        localRightY: pRight.y,
                        totalLength: initialDist + MIN_EXTRA_LENGTH,
                        curveFactor1: (Math.random() - 0.5) * 1.5,
                        curveFactor2: (Math.random() - 0.5) * 1.5,
                        phaseShift: Math.random() * Math.PI * 2,
                        baseColor: YARN_COLORS[i % YARN_COLORS.length],
                        cp1: { x: 0, y: 0 },
                        cp2: { x: 0, y: 0 },
                        leftPt: { x: 0, y: 0 },
                        rightPt: { x: 0, y: 0 }
                    });
                }
            }

            function drawYarnThreads(targetCtx, time) {
                threads.forEach((t, index) => {
                    const lx = t.localLeftX - currentOffset;
                    const ly = t.localLeftY;
                    const rx = t.localRightX + currentOffset;
                    const ry = t.localRightY;

                    const straightDist = Math.hypot(rx - lx, ry - ly);
                    const slack = Math.max(0, t.totalLength - straightDist);
                    const sagDepth = Math.pow(slack, 0.78) * 0.7;

                    const pulseMulplier = 2.5 + 0.5 * Math.sin(time * 0.002 + index);
                    const pulse = Math.sin(time * 0.003 + t.phaseShift) * 3 * pulseMulplier;

                    const cp1x = lx + (rx - lx) * 0.35 + (t.curveFactor1 * sagDepth * 0.25);
                    const cp1y = ly + sagDepth * 0.8 + pulse + (t.curveFactor1 * 20);

                    const cp2x = lx + (rx - lx) * 0.65 + (t.curveFactor2 * sagDepth * 0.25);
                    const cp2y = ry + sagDepth * 0.8 - pulse + (t.curveFactor2 * 20);

                    targetCtx.save();

                    targetCtx.beginPath();
                    targetCtx.moveTo(lx, ly + 4);
                    targetCtx.bezierCurveTo(cp1x, cp1y + 4, cp2x, cp2y + 4, rx, ry + 4);
                    targetCtx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
                    targetCtx.lineWidth = 5;
                    targetCtx.stroke();

                    targetCtx.beginPath();
                    targetCtx.moveTo(lx, ly);
                    targetCtx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, rx, ry);
                    targetCtx.strokeStyle = t.baseColor;
                    targetCtx.lineWidth = 4.5;
                    targetCtx.lineCap = 'round';
                    targetCtx.stroke();

                    targetCtx.setLineDash([4, 3]);
                    targetCtx.beginPath();
                    targetCtx.moveTo(lx, ly);
                    targetCtx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, rx, ry);
                    targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                    targetCtx.lineWidth = 2;
                    targetCtx.stroke();

                    targetCtx.setLineDash([2, 5]);
                    targetCtx.beginPath();
                    targetCtx.moveTo(lx - 1, ly - 1);
                    targetCtx.bezierCurveTo(cp1x - 1, cp1y - 1, cp2x - 1, cp2y - 1, rx - 1, ry - 1);
                    targetCtx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    targetCtx.lineWidth = 2;
                    targetCtx.stroke();

                    targetCtx.setLineDash([]);
                    targetCtx.strokeStyle = t.baseColor;
                    targetCtx.lineWidth = 1;
                    targetCtx.globalAlpha = 0.6;

                    const samples = 15;
                    for (let i = 1; i < samples; i++) {
                        const u = i / samples;
                        const px = Math.pow(1 - u, 3) * lx + 3 * Math.pow(1 - u, 2) * u * cp1x + 3 * (1 - u) * u * u * cp2x + u * u * u * rx;
                        const py = Math.pow(1 - u, 3) * ly + 3 * Math.pow(1 - u, 2) * u * cp1y + 3 * (1 - u) * u * u * cp2y + u * u * u * ry;

                        const fuzzAngle = (index + i * 17) % (Math.PI * 2);
                        const fuzzLen = 2.5 + ((i + index) % 3);

                        targetCtx.beginPath();
                        targetCtx.moveTo(px, py);
                        targetCtx.lineTo(px + Math.cos(fuzzAngle) * fuzzLen, py + Math.sin(fuzzAngle) * fuzzLen);
                        targetCtx.stroke();
                    }

                    targetCtx.restore();
                });
            }

            function drawMaskedThreads(time) {
                threadsCtx.clearRect(0, 0, 1200, 900);
                drawYarnThreads(threadsCtx, time);
                threadsCtx.globalCompositeOperation = 'destination-out';
                threadsCtx.drawImage(images.leftMask, -currentOffset, 0, 1200, 900);
                threadsCtx.globalCompositeOperation = 'source-over';
                ctx.drawImage(threadsCanvas, 0, 0, 1200, 900);
            }

            // === FIX #2: CACHE SHADE MASK + INSIDE MASK, CHI VE LAI KHI currentOffset THAY DOI ===
            let lastCachedOffset = null; // offset da dung de tinh cache lan cuoi (null = chua tinh)

            function rebuildStaticMasksIfNeeded() {
                if (currentOffset === lastCachedOffset) return; // offset khong doi -> dung lai cache cu

                // --- Shade + Right_Mask ---
                shadeMaskCtx.clearRect(0, 0, 1200, 900);
                shadeMaskCtx.drawImage(images.shade, -currentOffset, 0, 1200, 900);
                shadeMaskCtx.globalCompositeOperation = 'destination-out';
                shadeMaskCtx.drawImage(images.rightMask, currentOffset, 0, 1200, 900);
                shadeMaskCtx.globalCompositeOperation = 'source-over';

                // --- Inside + Left_Mask + Right_Mask ---
                insideMaskCtx.clearRect(0, 0, 1200, 900);
                insideMaskCtx.drawImage(images.inside, 0, 0, 1200, 900);
                insideMaskCtx.globalCompositeOperation = 'destination-out';
                insideMaskCtx.drawImage(images.leftMask, -currentOffset, 0, 1200, 900);
                insideMaskCtx.drawImage(images.rightMask, currentOffset, 0, 1200, 900);
                insideMaskCtx.globalCompositeOperation = 'source-over';

                lastCachedOffset = currentOffset;
            }

            function drawClippedEye() {
                // Chi lam viec trong bbox cua eyeBound thay vi toan bo 1200x900
                const b = eyeBoundBBox || { x: 0, y: 0, w: 1200, h: 900 };

                eyeClipCtx.clearRect(b.x, b.y, b.w, b.h);
                eyeClipCtx.drawImage(images.eyeBound, b.x, b.y, b.w, b.h, b.x, b.y, b.w, b.h);
                eyeClipCtx.globalCompositeOperation = 'source-in';
                // Lay dung phan nguon cua anh "eye" tuong ung voi vung dich b, co tinh den do lech currentEye.x/y
                eyeClipCtx.drawImage(
                    images.eye,
                    b.x - currentEye.x, b.y - currentEye.y, b.w, b.h,
                    b.x, b.y, b.w, b.h
                );
                eyeClipCtx.globalCompositeOperation = 'source-over';
                ctx.drawImage(eyeClipCanvas, b.x, b.y, b.w, b.h, b.x, b.y, b.w, b.h);
            }

            // === FIX #3 (BONUS): CAP NHAT MAT PHU O ~30FPS THAY VI 60FPS ===
            let lastExtraEyesUpdate = 0;
            const EXTRA_EYES_INTERVAL = 33; // ms, ~30fps

            function updateAndDrawExtraEyes(now) {
                const shouldUpdateLerp = (now - lastExtraEyesUpdate) >= EXTRA_EYES_INTERVAL;
                if (shouldUpdateLerp) lastExtraEyesUpdate = now;

                extraEyesConfig.forEach(cfg => {
                    if (now > cfg.nextChangeTime) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 0.2 + Math.random();

                        const unrotatedX = Math.cos(angle) * cfg.radiusX * dist;
                        const unrotatedY = Math.sin(angle) * cfg.radiusY * dist;

                        cfg.targetX = unrotatedX * Math.cos(cfg.rotation) - unrotatedY * Math.sin(cfg.rotation);
                        cfg.targetY = unrotatedX * Math.sin(cfg.rotation) + unrotatedY * Math.cos(cfg.rotation);

                        cfg.nextChangeTime = now + 500 + Math.random() * 2500;
                    }

                    if (shouldUpdateLerp) {
                        cfg.currX += (cfg.targetX - cfg.currX) * 0.16;
                        cfg.currY += (cfg.targetY - cfg.currY) * 0.16;
                    }

                    const eyeImg = images[`eye_${cfg.id}`];
                    const boundImg = images[`eye_${cfg.id}_bound`];

                    if (eyeImg && boundImg) {
                        // Chi lam viec trong bbox rieng cua tung mat phu (thay vi 1200x900 full-canvas)
                        const b = cfg.bbox || { x: 0, y: 0, w: 1200, h: 900 };

                        extraEyeClipCtx.clearRect(b.x, b.y, b.w, b.h);
                        extraEyeClipCtx.drawImage(boundImg, b.x, b.y, b.w, b.h, b.x, b.y, b.w, b.h);
                        extraEyeClipCtx.globalCompositeOperation = 'source-in';
                        extraEyeClipCtx.drawImage(
                            eyeImg,
                            b.x - cfg.currX, b.y - cfg.currY, b.w, b.h,
                            b.x, b.y, b.w, b.h
                        );
                        extraEyeClipCtx.globalCompositeOperation = 'source-over';

                        ctx.drawImage(extraEyeClipCanvas, b.x, b.y, b.w, b.h, b.x, b.y, b.w, b.h);
                    }
                });
            }

            function renderLoop(timestamp) {
                const now = timestamp || 0;
                ctx.clearRect(0, 0, 1200, 900);

                currentEye.x += (targetEye.x - currentEye.x) * 0.15;
                currentEye.y += (targetEye.y - currentEye.y) * 0.15;

                // 1. Nền
                ctx.drawImage(images.bg, 0, 0, 1200, 900);

                // 2 & 3. Cache shade + inside mask (chi tinh lai khi offset doi)
                rebuildStaticMasksIfNeeded();
                ctx.drawImage(shadeMaskCanvas, 0, 0, 1200, 900);
                ctx.drawImage(insideMaskCanvas, 0, 0, 1200, 900);

                // 4. Mắt phụ (Eye_01 - Eye_11) đảo mắt ngẫu nhiên, lerp o ~30fps
                updateAndDrawExtraEyes(now);

                // 5. Mắt chính follow cursor
                drawClippedEye();

                // 6. Dây len bị che bởi Left_Mask (van phai ve moi frame vi co animation)
                drawMaskedThreads(now);

                // 7. Bóng đổ mảng Left/Right (Multiply)
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';
                ctx.drawImage(images.leftShadow, -currentOffset, 0, 1200, 900);
                ctx.drawImage(images.rightShadow, currentOffset, 0, 1200, 900);
                ctx.restore();

                // 8. Hai mảnh Left / Right phủ trên cùng
                ctx.drawImage(images.left, -currentOffset, 0, 1200, 900);
                ctx.drawImage(images.right, currentOffset, 0, 1200, 900);

                // 9. Lớp phim cổ điển tối ưu hiệu năng (Pre-rendered)
                drawOldFilmEffect(now);

                requestAnimationFrame(renderLoop);
            }

            function getStagePos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (1200 / rect.width),
                    y: (clientY - rect.top) * (900 / rect.height)
                };
            }

            // === FIX #1 (tiep theo): TRA CUU ALPHA TU MANG DA TINH SAN, KHONG VE + KHONG getImageData ===
            function checkHitRegion(x, y) {
                const px = Math.floor(x);
                const py = Math.floor(y);

                if (px < 0 || px >= 1200 || py < 0 || py >= 900) return null;
                if (!leftAlpha || !rightAlpha) return null; // chua load xong

                // "left" duoc ve tai (-currentOffset, 0) => toa do goc trong anh = (px + currentOffset, py)
                const leftSrcX = px + currentOffset;
                if (leftSrcX >= 0 && leftSrcX < 1200) {
                    if (leftAlpha[py * 1200 + leftSrcX] > 10) return 'left';
                }

                // "right" duoc ve tai (currentOffset, 0) => toa do goc trong anh = (px - currentOffset, py)
                const rightSrcX = px - currentOffset;
                if (rightSrcX >= 0 && rightSrcX < 1200) {
                    if (rightAlpha[py * 1200 + rightSrcX] > 10) return 'right';
                }

                return null;
            }

            function onPointerDown(e) {
                const pos = getStagePos(e);
                const hitTarget = checkHitRegion(pos.x, pos.y);

                if (hitTarget) {
                    isDragging = true;
                    dragSource = hitTarget;
                    startStageX = pos.x;
                    dragStartOffset = currentOffset;
                    stage.style.cursor = 'grabbing';
                }
            }

            function onPointerMove(e) {
                const pos = getStagePos(e);
                updateEyePosition(pos.x, pos.y);

                if (!isDragging) {
                    const hitTarget = checkHitRegion(pos.x, pos.y);
                    stage.style.cursor = hitTarget ? 'grab' : 'default';
                    return;
                }

                const deltaStageX = pos.x - startStageX;

                let newOffset = (dragSource === 'left')
                    ? dragStartOffset - deltaStageX
                    : dragStartOffset + deltaStageX;

                currentOffset = Math.max(0, Math.min(MAX_DRAG_DIST, newOffset));
            }

            function onPointerUp() {
                if (isDragging) {
                    isDragging = false;
                    dragSource = null;
                    stage.style.cursor = 'default';
                }
            }

            function updateEyePosition(cursorX, cursorY) {
                const dx = cursorX - EYE_CONFIG.centerX;
                const dy = cursorY - EYE_CONFIG.centerY;

                const percentX = Math.max(-1, Math.min(1, dx / EYE_CONFIG.centerX));
                const percentY = Math.max(-1, Math.min(1, dy / EYE_CONFIG.centerY));

                let rawTargetX = percentX * EYE_CONFIG.maxRadius;
                let rawTargetY = percentY * EYE_CONFIG.maxRadius;

                const distFromCenter = Math.hypot(rawTargetX, rawTargetY);
                if (distFromCenter > EYE_CONFIG.maxRadius) {
                    const angle = Math.atan2(rawTargetY, rawTargetX);
                    rawTargetX = Math.cos(angle) * EYE_CONFIG.maxRadius;
                    rawTargetY = Math.sin(angle) * EYE_CONFIG.maxRadius;
                }

                targetEye.x = rawTargetX;
                targetEye.y = rawTargetY;
            }

            stage.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            stage.addEventListener('touchstart', onPointerDown, { passive: true });
            window.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);
        })();
    </script>
</body>
